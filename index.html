<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Севастополь 2026</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:       #F2C440;
      --gold-dark:  #C9A030;
      --gold-dim:   rgba(242,196,64,0.12);
      --bg:         #0D0D0D;
      --surface:    #161616;
      --surface2:   #1E1E1E;
      --border:     #2A2A2A;
      --text:       #FFFFFF;
      --hint:       #666666;
      --red:        #e53935;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 0 16px 40px;
      position: relative;
    }

    .bg-statue {
      position: fixed;
      top: 0;
      left: 0;
      width: 55%;
      height: var(--statue-h, 100vh);
      background: url('bg.png') center top / cover no-repeat;
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
      -webkit-mask-image: linear-gradient(to left, transparent 0%, black 50%);
      mask-image: linear-gradient(to left, transparent 0%, black 50%);
    }

    body > * { position: relative; z-index: 1; }

    /* ── HEADER ─────────────────────────────── */
    .header {
      text-align: center;
      padding: 28px 0 0;
      position: relative;
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 4px;
    }

    .logo-wrap img {
      width: 160px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .header-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3.5px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .deadline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(242,196,64,0.35);
      border-radius: 4px;
      padding: 6px 12px;
      margin-bottom: 20px;
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-transform: uppercase;
      background: rgba(242,196,64,0.06);
    }

    .deadline-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ── DIVIDER ─────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border));
    }
    .divider-line.right {
      background: linear-gradient(to left, transparent, var(--border));
    }

    .divider svg { flex-shrink: 0; }

    /* ── FORM ────────────────────────────────── */
    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 2px;
      padding-left: 2px;
    }

    input[type="text"],
    input[type="url"],
    input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
      -webkit-appearance: none;
      font-family: inherit;
    }

    input::placeholder { color: #3A3A3A; }

    input:focus {
      border-color: var(--gold);
      background: var(--surface2);
    }

    input.error { border-color: var(--red); }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── CATEGORIES ──────────────────────────── */
    .category-group {
      display: flex;
      gap: 8px;
    }

    .category-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--hint);
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 13px 4px;
      text-align: center;
      text-transform: uppercase;
      transition: all 0.18s;
      position: relative;
      overflow: hidden;
    }

    .category-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold-dim);
      opacity: 0;
      transition: opacity 0.18s;
    }

    .category-btn:active::after { opacity: 1; }

    .category-btn.selected {
      background: var(--gold);
      border-color: var(--gold);
      color: #0D0D0D;
    }

    .category-group.error .category-btn:not(.selected) {
      border-color: var(--red);
    }

    /* ── ERRORS ──────────────────────────────── */
    .field-error {
      color: var(--red);
      font-size: 12px;
      min-height: 15px;
      padding-left: 2px;
    }

    /* ── SUBMIT ──────────────────────────────── */
    .submit-wrap {
      margin-top: 4px;
      position: relative;
    }

    /* angular corner decoration */
    .corner { position: absolute; width: 10px; height: 10px; }
    .corner.tl { top: 0; left: 0;  border-top: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
    .corner.tr { top: 0; right: 0; border-top: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
    .corner.bl { bottom: 0; left: 0;  border-bottom: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
    .corner.br { bottom: 0; right: 0; border-bottom: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }

    .submit-btn {
      background: var(--gold);
      border: none;
      border-radius: 0;
      color: #0D0D0D;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 17px 16px;
      text-transform: uppercase;
      transition: background 0.18s, transform 0.1s;
      width: 100%;
      position: relative;
    }

    .submit-btn:active { background: var(--gold-dark); transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.5; pointer-events: none; }

    .submit-btn .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0D0D0D;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
    }

    .submit-btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ── SUCCESS ─────────────────────────────── */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      gap: 0;
      padding: 0 24px;
    }

    .success-screen.visible { display: flex; }
    .form.hidden { display: none; }
    .header.hidden { display: none; }

    @keyframes pop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .success-title {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .success-text {
      font-size: 14px;
      color: var(--hint);
      line-height: 1.6;
      max-width: 240px;
    }

    .success-divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 16px auto;
    }

    .success-data {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      margin: 16px 0 24px;
      text-align: left;
      font-size: 14px;
      line-height: 2;
      color: var(--text);
    }

    .success-data span { color: var(--hint); }

    .success-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .success-btn {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 14px 16px;
      border-radius: 0;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.18s, transform 0.1s;
    }

    .success-btn:active { transform: scale(0.99); }

    .success-btn.primary {
      background: var(--gold);
      color: #0D0D0D;
    }

    .success-btn.primary:active { background: var(--gold-dark); }

    .success-btn.secondary {
      background: transparent;
      color: var(--hint);
      border: 1px solid var(--border);
    }

    .success-btn.secondary:active { background: var(--surface); }

    /* ── REGISTRATION CLOSED / RESULTS ───────── */
    .screen { display: none; }
    .screen.visible { display: block; }

    .closed-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 78vh;
      text-align: center;
      padding: 0 20px;
    }
    .closed-screen.visible { display: flex; }

    .closed-screen img {
      width: 140px;
      height: auto;
      margin-bottom: 22px;
      animation: pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }

    .closed-title {
      font-family: 'Oswald', sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .closed-divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 16px;
    }

    .closed-text {
      font-size: 14px;
      color: var(--hint);
      line-height: 1.6;
      max-width: 260px;
      margin-bottom: 28px;
    }

    /* shared "angular" gold button */
    .ghost-btn {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 16px 28px;
      border: none;
      background: var(--gold);
      color: #0D0D0D;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
    }
    .ghost-btn:active { background: var(--gold-dark); transform: scale(0.99); }

    /* ── RESULTS: header ─────────────────────── */
    .results-head {
      text-align: center;
      padding: 26px 0 18px;
    }
    .results-head .results-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3.5px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .results-head .results-title {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
    }

    /* ── RESULTS: category buttons ───────────── */
    .cat-block { margin-bottom: 20px; }
    .cat-block-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--hint);
      margin: 0 0 10px 2px;
    }
    .cat-row { display: flex; gap: 10px; }
    .cat-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 18px 8px;
      text-align: center;
      text-transform: uppercase;
      transition: all 0.18s;
    }
    .cat-btn:active { border-color: var(--gold); background: var(--surface2); transform: scale(0.99); }
    .cat-btn .cat-btn-gender { display: block; font-size: 15px; }
    .cat-btn .cat-btn-hint { display: block; font-size: 10px; color: var(--hint); letter-spacing: 1.5px; margin-top: 3px; }

    /* ── RESULTS: table ──────────────────────── */
    .table-head {
      text-align: center;
      padding: 24px 0 18px;
    }
    .table-head .th-cat {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .table-head .th-gender {
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--hint);
      margin-top: 4px;
    }

    .res-table { width: 100%; border-collapse: collapse; }
    .res-table th {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--hint);
      text-align: left;
      padding: 0 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .res-table th.num, .res-table td.num { text-align: center; width: 34px; }
    .res-table th.score, .res-table td.score { text-align: right; width: 70px; white-space: nowrap; }
    .res-table td {
      font-size: 14px;
      padding: 13px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .res-table tr:last-child td { border-bottom: none; }
    .res-table td.rank { color: var(--gold); font-family: 'Oswald', sans-serif; font-weight: 700; }
    .res-table td.score { font-family: 'Oswald', sans-serif; font-weight: 700; color: var(--gold); }
    .res-table td.name a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--hint); }

    .res-state {
      text-align: center;
      color: var(--hint);
      font-size: 14px;
      padding: 60px 20px;
      line-height: 1.6;
    }
    .res-spinner {
      width: 26px; height: 26px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin2 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin2 { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="bg-statue"></div>

<div class="header" id="header">
  <div class="logo-wrap">
    <img src="logo.png" alt="CrossFit Севастополь" width="160" height="180" fetchpriority="high" decoding="sync" />
  </div>
  <div class="header-sub">Отборочный комплекс</div>
  <div class="deadline">
    <span class="deadline-dot"></span>
    Приём заявок до 30 мая
    <span class="deadline-dot"></span>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <svg width="20" height="14" viewBox="0 0 20 14" fill="none">
      <path d="M10 1L19 7L10 13L1 7L10 1Z" stroke="#F2C440" stroke-width="1.2" fill="none"/>
    </svg>
    <div class="divider-line right"></div>
  </div>
</div>

<form class="form" id="form" novalidate>

  <div class="field">
    <label>ФИО</label>
    <input type="text" id="name" placeholder="Иванов Иван Иванович" autocomplete="name" />
    <span class="field-error" id="name-error"></span>
  </div>

  <div class="field">
    <label>Категория</label>
    <div class="category-group" id="category-group">
      <button type="button" class="category-btn" data-value="Новички">Новички</button>
      <button type="button" class="category-btn" data-value="Любители">Любители</button>
      <button type="button" class="category-btn" data-value="Продвинутые">Продвинутые</button>
    </div>
    <span class="field-error" id="category-error"></span>
  </div>

  <div class="field">
    <label>Количество берпи</label>
    <input type="number" id="burpees" placeholder="например, 50" min="1" max="10000" inputmode="numeric" />
    <span class="field-error" id="burpees-error"></span>
  </div>

  <div class="field">
    <label>Ссылка на видео</label>
    <input type="url" id="video" placeholder="https://..." inputmode="url" autocomplete="off" />
    <span class="field-error" id="video-error"></span>
  </div>

  <div class="submit-wrap">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <button type="submit" class="submit-btn" id="submit-btn">
      Отправить результат
      <span class="spinner"></span>
    </button>
  </div>

</form>

<!-- REGISTRATION CLOSED -->
<div class="closed-screen screen" id="closed-screen">
  <img src="logo.png" alt="CrossFit Севастополь" />
  <div class="closed-title">Приём заявок<br>завершён</div>
  <div class="closed-divider"></div>
  <div class="closed-text">Спасибо всем за участие! 🔥<br>Результаты соревнования скоро будут доступны здесь.</div>
  <button type="button" class="ghost-btn" id="open-results-btn" style="display:none;">Посмотреть результаты</button>
</div>

<!-- RESULTS: category selection -->
<div class="screen" id="results-cats">
  <div class="results-head">
    <div class="results-sub">Битва за Херсонес 2026</div>
    <div class="results-title">Результаты</div>
  </div>
  <div id="cat-buttons"></div>
</div>

<!-- RESULTS: table -->
<div class="screen" id="results-table-screen">
  <div class="table-head">
    <div class="th-cat" id="table-cat"></div>
    <div class="th-gender" id="table-gender"></div>
  </div>
  <div id="table-body"></div>
</div>

<!-- SUCCESS -->
<div class="success-screen" id="success-screen">
  <img src="logo.png" alt="CrossFit Севастополь" style="width:130px;height:auto;margin-bottom:20px;animation:pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275) both;" />
  <div class="success-title" id="success-title">Проверь заявку</div>
  <div class="success-divider"></div>
  <div class="success-text" id="success-text">Всё верно? Нажми кнопку<br>ниже чтобы отправить.</div>
  <div class="success-data" id="success-data"></div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();

  let maxHeight = window.innerHeight;
  function lockStatueHeight() {
    maxHeight = Math.max(maxHeight, window.innerHeight);
    document.documentElement.style.setProperty('--statue-h', maxHeight + 'px');
  }
  lockStatueHeight();
  tg.onEvent('viewportChanged', ({ isStateStable }) => {
    if (isStateStable) lockStatueHeight();
  });

  const urlParams        = new URLSearchParams(window.location.search);
  const isEditMode       = urlParams.get('mode') === 'edit';
  let   selectedCategory = null;

  // ── РЕЖИМ РЕЗУЛЬТАТОВ (приём заявок завершён) ──────────────
  const REGISTRATION_CLOSED = true;
  // Доступ к результатам на этапе настройки — только эти Telegram ID.
  // Когда откроем для всех — оставить массив пустым ИЛИ выставить RESULTS_PUBLIC = true.
  const ADMIN_IDS     = [77180808];  // Telegram ID админов (доступ к результатам на этапе настройки)
  const RESULTS_PUBLIC = false;       // true → результаты видны всем
  const API_BASE      = 'https://crossfit-tma-production.up.railway.app';
  const RES_CATS      = ['Новички', 'Любители', 'Продвинутые'];
  const RES_GENDERS   = [{ code: 'М', label: 'Мужчины' }, { code: 'Ж', label: 'Женщины' }];
  const CAT_ICON      = { 'Новички': '🟢', 'Любители': '🟡', 'Продвинутые': '🔴' };

  // Выбор категории
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCategory = btn.dataset.value;
      clearError('category');
    });
  });

  function clearError(id) {
    const el = document.getElementById(id + '-error');
    if (el) el.textContent = '';
    const input = document.getElementById(id);
    if (input) input.classList.remove('error');
    if (id === 'category') document.getElementById('category-group').classList.remove('error');
  }

  ['name', 'burpees', 'video'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => clearError(id));
  });

  function validate() {
    let valid = true;
    const name = document.getElementById('name').value.trim();
    if (!name) {
      document.getElementById('name-error').textContent = 'Введите имя';
      document.getElementById('name').classList.add('error');
      valid = false;
    }
    if (!selectedCategory) {
      document.getElementById('category-error').textContent = 'Выберите категорию';
      document.getElementById('category-group').classList.add('error');
      valid = false;
    }
    const burpees = document.getElementById('burpees').value.trim();
    if (!burpees || isNaN(burpees) || Number(burpees) < 1) {
      document.getElementById('burpees-error').textContent = 'Укажите количество берпи';
      document.getElementById('burpees').classList.add('error');
      valid = false;
    }
    const video = document.getElementById('video').value.trim();
    if (!video || !/^(https?:\/\/).+\..+/.test(video)) {
      document.getElementById('video-error').textContent = 'Укажите ссылку (начиная с http:// или https://)';
      document.getElementById('video').classList.add('error');
      valid = false;
    }
    return valid;
  }

  // Предзаполнение в режиме редактирования
  function applyEditMode() {
    document.querySelector('.header-sub').textContent = 'Редактировать заявку';
    document.getElementById('submit-btn').childNodes[0].textContent = 'Сохранить изменения';
    document.getElementById('name').value    = urlParams.get('name')    || '';
    document.getElementById('burpees').value = urlParams.get('burpees') || '';
    document.getElementById('video').value   = urlParams.get('video')   || '';
    const cat = urlParams.get('category');
    if (cat) {
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.dataset.value === cat) { btn.classList.add('selected'); selectedCategory = cat; }
      });
    }
  }

  if (isEditMode) applyEditMode();

  const ICONS = { 'Новички': '🟢', 'Любители': '🟡', 'Продвинутые': '🔴' };
  let pendingPayload = null;

  tg.MainButton.setParams({
    color:      '#F2C440',
    text_color: '#0D0D0D',
  });

  tg.MainButton.onClick(() => {
    tg.MainButton.hide();
    tg.BackButton.hide();
    try { tg.sendData(pendingPayload); } catch (err) { console.error(err); }
  });

  tg.BackButton.onClick(() => {
    if (REGISTRATION_CLOSED) return;   // в режиме результатов навигацией управляет resultsBack()
    tg.BackButton.hide();
    tg.MainButton.hide();
    pendingPayload = null;
    document.getElementById('success-screen').classList.remove('visible');
    document.getElementById('header').classList.remove('hidden');
    document.getElementById('form').classList.remove('hidden');
    const btn = document.getElementById('submit-btn');
    btn.disabled = false;
    btn.classList.remove('loading');
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    if (!validate()) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.classList.add('loading');

    const data = {
      mode:     isEditMode ? 'edit' : 'new',
      name:     document.getElementById('name').value.trim(),
      category: selectedCategory,
      burpees:  Number(document.getElementById('burpees').value.trim()),
      video:    document.getElementById('video').value.trim(),
    };

    pendingPayload = JSON.stringify(data);

    document.getElementById('success-title').textContent = isEditMode ? 'Проверь изменения' : 'Проверь заявку';
    document.getElementById('success-text').innerHTML    = isEditMode
      ? 'Всё верно? Нажми кнопку ниже чтобы сохранить.'
      : 'Всё верно? Нажми кнопку ниже чтобы отправить.';
    document.getElementById('success-data').innerHTML =
      `<span>ФИО</span><br>${data.name}<br><br>` +
      `<span>Категория</span><br>${ICONS[data.category] || ''} ${data.category}<br><br>` +
      `<span>Берпи</span><br>${data.burpees}<br><br>` +
      `<span>Видео</span><br>${data.video}`;

    document.getElementById('header').classList.add('hidden');
    document.getElementById('form').classList.add('hidden');
    document.getElementById('success-screen').classList.add('visible');

    tg.MainButton.setText(isEditMode ? '✓ Сохранить изменения' : '✓ Отправить заявку');
    tg.MainButton.show();
    tg.BackButton.show();
  });

  // ── НАВИГАЦИЯ ПО РЕЗУЛЬТАТАМ ──────────────────────────────
  function hideAllScreens() {
    document.getElementById('header').classList.add('hidden');
    document.getElementById('form').classList.add('hidden');
    document.getElementById('success-screen').classList.remove('visible');
    ['closed-screen', 'results-cats', 'results-table-screen']
      .forEach(id => document.getElementById(id).classList.remove('visible'));
  }

  function goClosed() {
    hideAllScreens();
    document.getElementById('closed-screen').classList.add('visible');
    tg.BackButton.hide();
    window.scrollTo(0, 0);
  }

  function goCats() {
    hideAllScreens();
    document.getElementById('results-cats').classList.add('visible');
    tg.BackButton.show();
    window.scrollTo(0, 0);
  }

  function goTable(cat, genderCode) {
    hideAllScreens();
    document.getElementById('results-table-screen').classList.add('visible');
    tg.BackButton.show();
    window.scrollTo(0, 0);
    loadTable(cat, genderCode);
  }

  function resultsBack() {
    if (document.getElementById('results-table-screen').classList.contains('visible')) {
      goCats();
    } else if (document.getElementById('results-cats').classList.contains('visible')) {
      goClosed();
    }
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function buildCatButtons() {
    const wrap = document.getElementById('cat-buttons');
    wrap.innerHTML = RES_CATS.map(cat => `
      <div class="cat-block">
        <div class="cat-block-label">${CAT_ICON[cat] || ''} ${cat}</div>
        <div class="cat-row">
          ${RES_GENDERS.map(g => `
            <button type="button" class="cat-btn" data-cat="${escHtml(cat)}" data-gender="${g.code}">
              <span class="cat-btn-gender">${g.label}</span>
            </button>`).join('')}
        </div>
      </div>`).join('');
    wrap.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => goTable(btn.dataset.cat, btn.dataset.gender));
    });
  }

  function renderTable(rows) {
    const body = rows.map((p, i) => `
      <tr>
        <td class="num rank">${i + 1}</td>
        <td class="name">${escHtml(p.name)}</td>
        <td class="score">${escHtml(p.burpees)}</td>
      </tr>`).join('');
    return `<table class="res-table">
      <thead><tr><th class="num">#</th><th>ФИО</th><th class="score">Берпи</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  }

  async function loadTable(cat, genderCode) {
    const bodyEl = document.getElementById('table-body');
    document.getElementById('table-cat').textContent    = cat;
    document.getElementById('table-gender').textContent = (RES_GENDERS.find(g => g.code === genderCode) || {}).label || '';
    bodyEl.innerHTML = `<div class="res-state"><div class="res-spinner"></div>Загрузка…</div>`;
    try {
      const url = `${API_BASE}/api/results?category=${encodeURIComponent(cat)}&gender=${encodeURIComponent(genderCode)}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const rows = await resp.json();
      if (!Array.isArray(rows) || rows.length === 0) {
        bodyEl.innerHTML = `<div class="res-state">В этой категории пока нет участников.</div>`;
        return;
      }
      bodyEl.innerHTML = renderTable(rows);
    } catch (err) {
      console.error(err);
      bodyEl.innerHTML = `<div class="res-state">Не удалось загрузить результаты.<br>Попробуйте позже.</div>`;
    }
  }

  // ── ИНИЦИАЛИЗАЦИЯ РЕЖИМА РЕЗУЛЬТАТОВ ──────────────────────
  if (REGISTRATION_CLOSED) {
    const uid     = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;
    const isAdmin = RESULTS_PUBLIC || (uid && ADMIN_IDS.includes(uid));

    buildCatButtons();
    const openBtn = document.getElementById('open-results-btn');
    openBtn.addEventListener('click', goCats);
    if (isAdmin) openBtn.style.display = '';

    tg.BackButton.onClick(() => { if (REGISTRATION_CLOSED) resultsBack(); });
    goClosed();
  }
</script>
</body>
</html>
